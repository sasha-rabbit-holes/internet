<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Best Liar in Town</title>
<style>
:root{--bg:#14121c;--card:#221f2e;--ink:#f4f0ff;--dim:#9a94b0;--pink:#ff5fa2;--gold:#ffd24a;--green:#5fd38a;--red:#ff5f5f;--blue:#5fb3ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace}
body{min-height:calc(100*var(--vh));padding:max(env(safe-area-inset-top),12px) 14px calc(env(safe-area-inset-bottom) + 130px);max-width:560px;margin:0 auto;text-align:center}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:1px}h1 span{color:var(--pink)}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.big{font-size:20px;font-weight:700;margin:6px 0}.dim{color:var(--dim);font-size:13px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;color:#111;background:var(--gold);cursor:pointer;width:100%}
button:active{transform:scale(.97)}button:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.lie{background:var(--red)}.truth{background:var(--green)}.alt{background:#3a3550;color:var(--ink)}
.prompt{background:#2e2a42;border:2px dashed var(--pink);border-radius:12px;padding:14px;font-size:17px;line-height:1.35;margin:8px 0}
.timer{font-size:44px;font-weight:700;color:var(--gold)}
.ppl{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.p{width:72px;font-size:11px;position:relative}.p svg{display:block;margin:0 auto}.p b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p.on{outline:2px solid var(--gold);border-radius:10px}.tag{position:absolute;top:-4px;right:2px;font-size:14px}
.stage{position:relative;width:min(calc(80*var(--vw)),300px);height:min(calc(80*var(--vw)),300px);margin:8px auto}
#wheel{width:100%;height:100%;transform-origin:50% 50%}
.ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:30px;color:var(--gold);z-index:2}
.ring{position:absolute;left:50%;top:50%;width:0;height:0}.ring .p{position:absolute;width:56px;margin:-34px 0 0 -28px}
#arrow{position:absolute;inset:0;transform-origin:50% 50%}
#arrow:after{content:"";position:absolute;left:50%;top:22%;width:6px;height:28%;margin-left:-3px;background:var(--pink);border-radius:3px}
#arrow:before{content:"";position:absolute;left:50%;top:14%;margin-left:-14px;border:14px solid transparent;border-bottom:22px solid var(--pink);border-top:0}
.lb{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 12px;margin:6px 0;text-align:left}
.lb .n{font-size:20px;width:28px}.lb .s{margin-left:auto;font-size:22px;color:var(--gold);font-weight:700}.lb.first{border:2px solid var(--gold)}
#host{position:fixed;left:0;right:0;bottom:0;background:#0d0b14;border-top:2px solid var(--pink);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);z-index:9}
#host .in{max-width:560px;margin:auto}#host input{width:70px;font:inherit;padding:10px;border-radius:8px;border:0;background:#2a2640;color:var(--ink);text-align:center}
#host small{display:block;color:var(--dim);margin-bottom:6px;font-size:11px}
a{color:var(--pink)}
/* ===== TV ===== */
body{padding-top:84px}
.crt{position:fixed;inset:0;pointer-events:none;z-index:50;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:1}48%{opacity:.93}50%{opacity:1}52%{opacity:.9}}
.bezel{position:fixed;inset:0;pointer-events:none;z-index:51;border:8px solid #050408;border-radius:26px;box-shadow:inset 0 0 40px rgba(0,0,0,.7)}
#bar{position:fixed;top:0;left:0;right:0;z-index:40;background:linear-gradient(#0d0b14,#14121c);padding:max(env(safe-area-inset-top),10px) 18px 6px;display:flex;align-items:center;gap:10px;font-size:12px}
.live{background:#e5252a;color:#fff;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:1px}.live:before{content:"●";margin-right:5px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#bar .show{margin-left:auto;color:var(--dim)}#clk{color:var(--gold);font-weight:700}
#ticker{position:fixed;top:calc(max(env(safe-area-inset-top),10px) + 30px);left:0;right:0;z-index:40;background:var(--pink);color:#111;font-weight:700;font-size:12px;overflow:hidden;white-space:nowrap;padding:4px 0}
#ticker span{display:inline-block;padding-left:100%;animation:tick 22s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.bug{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:41;font-size:11px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:2px}
body.hosting .bug{bottom:150px}
.lower{background:linear-gradient(90deg,var(--pink),#b04bff);color:#fff;text-align:left;padding:6px 12px;border-radius:4px;font-weight:700;margin:8px 0;font-size:13px;letter-spacing:1px}
/* ===== intro ===== */
#intro{position:fixed;inset:0;z-index:100;background:#0a0810;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
#static{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;transition:opacity 1s}
#static.fade{opacity:0}
#intro .roll{position:absolute;left:0;right:0;height:22%;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.14),transparent);animation:rollbar 1.8s linear infinite;transition:opacity 1s}
#intro .roll.fade{opacity:0}
@keyframes rollbar{from{top:-25%}to{top:110%}}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .6s;padding:20px}
#title.show{opacity:1}
#title h2{font-size:clamp(34px,calc(11*var(--vw)),60px);line-height:1;margin:10px 0;color:#fff;text-shadow:0 0 12px var(--pink),0 0 30px var(--pink),4px 4px 0 #b04bff;animation:neon 2s infinite}
#title h2 em{color:var(--gold);font-style:normal}
@keyframes neon{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.5}96%{opacity:1}}
#title p{color:var(--dim);font-size:14px;max-width:300px;min-height:40px}
.bars{display:flex;height:30px;width:min(calc(80*var(--vw)),320px);margin-bottom:16px}.bars i{flex:1}

.tstage{position:relative;width:min(calc(92*var(--vw)),500px);aspect-ratio:1;margin:6px auto}
.tbl{position:absolute;inset:17%;border-radius:50%;background:repeating-radial-gradient(circle,#7a4c28 0 6px,#6e4524 6px 12px);border:6px solid #4a2d16;box-shadow:0 10px 24px #000a,inset 0 0 30px #0007}
#bottle{cursor:pointer;position:absolute;left:43.5%;top:30.5%;width:13%;height:39%}
.seat{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:9px}
.seat b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat svg{display:block;margin:0 auto}.seat.done{opacity:.4}
.seat.hit{z-index:3;animation:hop .6s 3}.seat.hit svg{filter:drop-shadow(0 0 6px var(--gold))}.seat.hit b{color:var(--gold)}
@keyframes hop{50%{transform:translate(-50%,-50%) scale(1.4)}}
#pop{position:fixed;inset:0;z-index:60;background:#0a0810d9;display:none;align-items:center;justify-content:center;padding:20px}
.popcard{background:var(--card);border:3px solid var(--pink);border-radius:18px;padding:18px;max-width:380px;width:100%;text-align:center}
.popcard.in{animation:pin .35s}@keyframes pin{from{transform:scale(.6);opacity:0}}
.popcard h3{margin:8px 0;font-size:24px;line-height:1.1}.popcard .pk{color:var(--gold);font-weight:700}
.or{flex:0 0 auto!important;align-self:center;color:var(--dim)}
#rot{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 160px);z-index:45;background:var(--gold);color:#111;font-weight:700;font-size:12px;padding:6px 12px;border-radius:20px;pointer-events:none;white-space:nowrap}
#pop{overflow:auto}.popcard{margin:auto}
#rot{display:none!important}
@media (orientation:portrait){#panel{max-height:none;overflow:visible}.tstage{width:min(calc(92*var(--vw)),500px)}.stage{width:min(calc(80*var(--vw)),300px);height:min(calc(80*var(--vw)),300px)}}
/* ===== horizontal (landscape) layout: table left, info right ===== */
@media (orientation:landscape) and (min-width:700px){
 body{max-width:1100px;padding-top:76px;padding-bottom:calc(env(safe-area-inset-bottom) + 84px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:20px;align-items:start}
 .sub{grid-column:1/-1;margin:0}
 #anim{grid-column:1;grid-row:2/4}
 #panel{grid-column:2;grid-row:2;align-self:center}
 #anim:empty+#panel{grid-column:1/-1}
 .tstage{width:min(calc(46*var(--vw)),calc(calc(100*var(--vh)) - 150px),560px)}
 .stage{width:min(calc(34*var(--vw)),calc(calc(100*var(--vh)) - 160px),300px);height:min(calc(34*var(--vw)),calc(calc(100*var(--vh)) - 160px),300px)}
 #host .in{max-width:1100px}
 #host small{display:none}
 #hostbtns{display:flex;gap:8px;align-items:center}
 #hostbtns>*{flex:1}#hostbtns>div[style*="height:8px"]{display:none}
 #hostbtns .row{margin:0!important}
 #hostbtns button,#host button{padding:10px 12px}
 .popcard{max-width:520px;padding:12px}.popcard h3{font-size:20px}
 body.hosting .bug{bottom:90px}
}
@media (orientation:landscape) and (min-width:700px){
 #tvwrap{width:min(calc(78*var(--vh)),calc(48*var(--vw)),420px)}
 #hint{bottom:6%}
 #title{padding:10px}
 .bars{height:min(calc(6*var(--vh)),22px);width:min(calc(60*var(--vw)),420px);margin-bottom:8px}
 #title h2{font-size:min(calc(11*var(--vh)),calc(7*var(--vw)),64px);margin:6px 0}
 #title h2 br{display:none}
 #title p{min-height:22px;max-width:calc(60*var(--vw))}
}

:root{--vw:1vw;--vh:1vh}
html{background:var(--bg)}
#panel{max-height:calc(100*var(--vh) - 170px);overflow:auto}
/* phone held upright: turn the whole page sideways so it is horizontal by default */
html.rot body{position:fixed;top:0;left:100%;margin:0;max-width:none;transform-origin:0 0;transform:rotate(90deg);width:calc(100*var(--vw));height:calc(100*var(--vh));min-height:0;overflow:hidden}

/* ===== calm pass: same TV, clearer order. 1) what's happening  2) the one action  3) everything else is quiet ===== */
:root{--t-s:12px;--t-m:16px;--t-l:24px}
.crt{background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%);animation:flick 6s infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:1}52%{opacity:.94}}
#bar{font-size:var(--t-s)}
#ticker{background:#1b1826;color:var(--dim);font-weight:400;font-size:11px;border-top:1px solid #2b2838;border-bottom:1px solid #2b2838;padding:3px 0}
#ticker span{animation-duration:48s}
.bug{color:rgba(255,255,255,.18)}
.sub{font-size:var(--t-s);margin-bottom:4px}
.lower{background:linear-gradient(90deg,rgba(255,95,162,.9),rgba(176,75,255,.35) 60%,transparent);font-size:var(--t-s);letter-spacing:.08em;padding:4px 12px;margin:6px 0 10px;border-radius:2px}
.big{font-size:var(--t-l);margin:8px 0;line-height:1.2}
.dim{font-size:var(--t-s)}
.prompt{background:none;border:0;padding:0;font-size:var(--t-l);font-weight:700;line-height:1.3;margin:12px 0 20px}
.card{background:#1b1826;margin:12px 0}
.tbl{filter:saturate(.6) brightness(.8)}
.seat{font-size:11px}.seat b{color:var(--dim);font-weight:400}
.timer{font-size:48px}
/* buttons: one gold action, everything else quiet; lie/truth show colour as an outline until picked */
button{min-height:52px;font-size:var(--t-m)}
.alt{background:transparent;color:var(--ink);border:1px solid #3a3550}
.lie.alt{background:transparent;border:2px solid var(--red);color:var(--red)}
.truth.alt{background:transparent;border:2px solid var(--green);color:var(--green)}
.sm{min-height:38px;font-size:var(--t-s);padding:8px 12px}
.popcard{border:1px solid #3a3550;background:#1b1826}
.popcard h3{font-size:var(--t-l)}.popcard .pk{color:var(--pink);font-size:var(--t-s);letter-spacing:.1em}
#host{border-top:1px solid #2b2838}
#host small{display:none}
.or{display:none}
.lb{background:transparent;border-radius:0;border-bottom:1px solid #2b2838;margin:0}
.lb.first{border:0;border-bottom:1px solid var(--gold)}
#title h2{text-shadow:0 0 10px var(--pink),3px 3px 0 #b04bff}
.card .lower{background:none;color:var(--pink);padding:0;text-align:center;margin:0 0 8px}


.lower{background:linear-gradient(90deg,#2e6a96,rgba(46,106,150,.5) 65%,transparent)}
.card .lower{background:none}

body{padding-top:56px}
@media (orientation:landscape) and (min-width:700px){body{padding-top:50px}}

function tableHTML(ids,ph){
  const list=ids.map(byId).filter(Boolean), n=list.length, sp=S.spoken||{};
  const [w,h,sw]=n<=6?[30,43,74]:n<=10?[26,37,64]:n<=16?[20,29,50]:[15,22,36];
  let s=`<div class="lower">${ph==='lobby'?"TONIGHT'S CONTESTANTS":ph==='prompt'?(isHost?'TAP THE BOTTLE':'GET READY'):'THE BOTTLE DECIDES'}</div><div class="tstage"><div class="tbl"></div>`;
  list.forEach((p,i)=>{const a=i*2*Math.PI/n;
    s+=`<div class="seat ${sp[p.id]&&p.id!==S.speaker?'done':''}" data-id="${esc(p.id)}" style="left:${(50+40*Math.sin(a)).toFixed(1)}%;top:${(50-40*Math.cos(a)).toFixed(1)}%;width:${sw}px">${av(p,w,h)}<b>${esc(p.name)}</b></div>`});
  return s+(ph==='lobby'||ph==='prompt'?BOTTLE.replace('id="bottle"','id="bottle" style="transform:rotate(25deg)"'):BOTTLE)+'</div>';
}
function sendPrompts(){
  const ids=players().map(p=>p.id); if(!ids.length)return;
  const prompts={}; ids.forEach(id=>prompts[id]=pick(pick(THEMES).p));
  set({phase:'prompt',mode:'bottle',promptAt:Date.now(),ring:ids,prompts,choices:null,votes:null,spoken:null,speaker:null,scores:null,reveal:null,bottleAt:null,bottleRot:null,timerEnd:null});
}
const left=()=>(S.ring||[]).filter(id=>byId(id)&&!(S.spoken||{})[id]).length;
function spinBottle(){
  if(S.phase==='bottle'&&!bottleDone())return;
  const ring=S.ring||[], sp0=S.spoken||{}, c=ring.filter(id=>byId(id)&&!sp0[id]); if(!c.length)return;
  const who=pick(c), i=ring.indexOf(who), seg=360/ring.length;
  set({phase:'bottle',mode:'bottle',speaker:who,bottleAt:Date.now(),bottleRot:360*6+i*seg+(Math.random()-.5)*seg*.4,spoken:{...sp0,[who]:true}});
}
function bottleTap(){if(isHost&&(S.phase==='prompt'||(S.phase==='bottle'&&bottleDone())))spinBottle()}
function bottleBtn(){return left()?`<button onclick="spinBottle()">Spin the bottle (${left()} left)</button>`:'<div class="dim">Everyone has told their story</div>'}
function calcScores(){const sc={},ch=S.choices||{};
  Object.entries(S.votes||{}).forEach(([sp,vs])=>{const truth=ch[sp]==='truth';Object.entries(vs||{}).forEach(([id,val])=>{if((val==='truth')===truth)sc[id]=(sc[id]||0)+1;else sc[sp]=(sc[sp]||0)+1})});return sc}
function markHit(){
  const sp=S.spoken||{}, live=S.phase==='bottle'&&bottleDone();
  document.querySelectorAll('.seat').forEach(e=>{const id=e.dataset.id;e.classList.toggle('hit',live&&S.speaker===id);e.classList.toggle('done',!!sp[id]&&!(S.phase==='bottle'&&S.speaker===id))});
}
let lastPop='',dismissed='';

const planBtns=c=>`<div class="row"><button class="lie ${c==='lie'?'':'alt'}" onclick="choose('lie')">Lie</button><button class="truth ${c==='truth'?'':'alt'}" onclick="choose('truth')">Truth</button></div>`;
function renderPop(ph){

    }else if(ph==='bottle'&&sp&&bottleDone()){
      const spP=byId(sp), nm=esc(spP&&spP.name), my=((S.votes||{})[sp]||{})[me.id];
      if(me.id===sp){key='sp'+S.bottleAt;
        h=`<div class="pk">THE BOTTLE HAS SPOKEN</div>${av(me,48,69)}<h3>You're up</h3><div class="prompt">${mine}</div>${planBtns(myc)}<button style="margin-top:12px" onclick="dismissPop()" ${myc?'':'disabled'}>I'm ready</button>`;
      }else{key='ls'+S.bottleAt;
        h=`<div class="pk">LISTEN CLOSELY</div>${av(spP,48,69)}<h3>${nm}'s story</h3><div class="row"><button class="lie ${my==='liar'?'':'alt'}" onclick="vote('liar')">Lying</button><button class="truth ${my==='truth'?'':'alt'}" onclick="vote('truth')">Truth</button></div>${my?'<button class="alt" style="margin-top:12px" onclick="dismissPop()">Close</button>':''}`;
      }
    }

  if(!h||dismissed===key){el.style.display='none';el.innerHTML='';if(!h)lastPop='';return}

}

var render=function(){
  const ph=S.phase||'lobby', pl=players();
  renderAnim(ph); renderPanel(ph,pl); renderHost(ph); renderPop(ph); markHit();
};
const wheelSVG=()=>{
  let s='<svg id="wheel" viewBox="-100 -100 200 200">';
  THEMES.forEach((t,i)=>{const a0=(i*SEG-90)*Math.PI/180,a1=((i+1)*SEG-90)*Math.PI/180,m=(a0+a1)/2;
    s+=`<path d="M0 0L${(98*Math.cos(a0)).toFixed(1)} ${(98*Math.sin(a0)).toFixed(1)}A98 98 0 0 1 ${(98*Math.cos(a1)).toFixed(1)} ${(98*Math.sin(a1)).toFixed(1)}Z" fill="${t.c}" stroke="#14121c" stroke-width="2"/>`+
    `<text x="${(62*Math.cos(m)).toFixed(1)}" y="${(62*Math.sin(m)).toFixed(1)}" font-size="11" font-weight="700" fill="#111" text-anchor="middle" dominant-baseline="middle" transform="rotate(${(m*180/Math.PI+90).toFixed(1)} ${(62*Math.cos(m)).toFixed(1)} ${(62*Math.sin(m)).toFixed(1)})">${t.n}</text>`});
  return s+'<circle r="9" fill="#14121c"/></svg>';
};
function spin(el,rot,at,dur){
  const el0=Date.now()-at; el.style.transition='none';
  if(el0>=dur){el.style.transform=`rotate(${rot}deg)`;return}
  el.style.transform='rotate(0deg)'; el.getBoundingClientRect();
  el.style.transition=`transform ${dur-el0}ms cubic-bezier(.12,.6,.1,1)`; el.style.transform=`rotate(${rot}deg)`;
}
const WDUR=4500, ADUR=4500;
const wheelDone=()=>Date.now()-S.spinAt>=WDUR, arrowDone=()=>Date.now()-S.arrowAt>=ADUR;
function renderAnim(ph){
  const a=$('anim');
  let key='';
  const bm=S.mode==='bottle'&&(ph==='prompt'||ph==='bottle');
  if(ph==='lobby')key='L'+players().map(p=>p.id).join();
  else if(bm)key='B'+S.bottleAt+ph;
  else if(ph==='wheel')key='w'+S.spinAt; else if(ph==='arrow')key='a'+S.arrowAt;
  if(key===animKey)return; animKey=key;
  if(!key){a.innerHTML='';return}
  if(ph==='lobby'||bm){
    a.innerHTML=tableHTML(ph==='lobby'?players().map(p=>p.id):S.ring||[],ph);
    if(ph==='bottle'){spin($('bottle'),S.bottleRot,S.bottleAt,BDUR);setTimeout(render,BDUR+100)}
  }else if(ph==='wheel'){
    a.innerHTML=`<div class="stage"><div class="ptr">▼</div>${wheelSVG()}</div>`;
    spin($('wheel'),S.rot,S.spinAt,WDUR); setTimeout(render,WDUR+100);
  }else{
    const ring=S.ring||[],n=ring.length;

}

  }else if(ph==='board'){
    const sc=S.mode==='bottle'?calcScores():(S.scores||{}), rank=[...pl].sort((a,b)=>(sc[b.id]||0)-(sc[a.id]||0));
    h=(rank[0]?`<div class="lower">BEST LIAR IN TOWN</div><div class="big" style="font-size:40px;color:var(--gold);margin:0 0 14px">${esc(rank[0].name)}</div>`:'')+rank.map((p,i)=>`<div class="lb ${i===0?'first':''}"><span class="n">${i+1}</span>${av(p,24,34)}<b>${esc(p.name)}</b><span class="s">${sc[p.id]||0}</span></div>`).join('');
  }
  P.innerHTML=h; tick();
}
function choiceCard(mine,myc,topic){
  if(isHost)return `<div class="card"><div class="dim">${topic}</div><div class="dim" style="margin-top:6px">Chosen so far: ${Object.keys(S.choices||{}).length} / ${players().length}</div></div>`;
  if(!mine)return `<div class="card dim">You joined after the wheel spun — watch this round!</div>`;
  return `<div class="card"><div class="dim">${topic}</div><div class="prompt">${esc(mine)}</div>${planBtns(myc)}</div>`;
}
function renderHost(ph){
  if(!isHost)return; $('host').style.display='block';
  const b=(t,f,c='')=>`<button class="${c}" onclick="${f}()">${t}</button>`;
  let h='';
  if(ph==='lobby')h=b('Send story prompts','sendPrompts');
  else if(ph==='board')h=(S.mode==='bottle'?bottleBtn():'')+'<div style="height:8px"></div>'+b('New round','sendPrompts','alt');
  else if(ph==='prompt'||ph==='bottle')h=bottleBtn();
  else if(ph==='wheel')h=b('Start thinking timer','startTimer')+`<div style="margin-top:8px" class="dim">seconds: <input id="secs" type="number" value="60"></div>`;
  else if(ph==='think')h=b("Time's up",'pickSpeaker');
  else if(ph==='arrow'||ph==='story')h=b('Reveal answer','reveal');
  else if(ph==='reveal')h=S.mode==='bottle'?b('Spin again','spinBottle'):b('Next speaker','pickSpeaker');
  h+=`<div class="row" style="margin-top:10px">${b('Leaderboard','board','alt sm')}${b('Reset','resetAll','alt sm')}</div>`;
  const old=$('secs')&&$('secs').value;
  $('hostbtns').innerHTML=h; if(old&&$('secs'))$('secs').value=old;
  $('hostinfo').textContent='HOST CONTROLS · phase: '+ph;
}
function tick(){
  const t=$('tm'); if(!t||!S.timerEnd)return;
  const left=Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)); t.textContent=left>0?left+'s':"Time's up!";
}
setInterval(tick,250);
/* ---- TV extras ---- */
if(isHost)document.body.classList.add('hosting');
const clk=()=>{$('clk').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};clk();setInterval(clk,15000);
const NEWS=['LIVE from the party: the search for the BEST LIAR IN TOWN','Breaking: someone in this room is lying right now','Stay tuned — the wheel decides your fate','Experts say 100% of guests have lied at least once tonight','Do NOT trust the person next to you','Audience at home: please vote responsibly'];
const SAY={prompt:'Story prompts are on their way to every phone…',bottle:'The bottle is spinning — who will it land on?',lobby:'Waiting for tonight’s guests to take their seats',wheel:'The wheel of topics is spinning!',think:'Guests are making up their stories… time is ticking',arrow:'The arrow is choosing a guest!',story:'A guest is on stage — LIAR or TRUTH?',reveal:'The truth is revealed!',board:'And your BEST LIAR IN TOWN is…'};
let lastTk='';function setTicker(ph){if(!$('tk'))return;const m='★ '+(SAY[ph]||'')+'   ●   '+NEWS.join('   ●   ');if(m!==lastTk){lastTk=m;$('tk').textContent=m}}
const _render=render;render=function(){_render();setTicker(S.phase||'lobby')};


</script></body></html>
