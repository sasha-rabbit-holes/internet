    else r.push([x,21,3,1,sk],[x+1,21,1,1,shoe],[x,22,3,1,shoe]);                                   // sandals: strap on a sole
  });
  r.push([7,11,2,1,sk],[3,6,1,2,sk],[12,6,1,2,sk],[4,4,8,7,sk],
    [6,7,1,2,'#2a1c1c'],[9,7,1,2,'#2a1c1c'],...BROW(brow),[7,9,2,1,'#b5654f'],[5,9,1,1,'rgba(214,90,90,.35)'],[10,9,1,1,'rgba(214,90,90,.35)']);
  if(ts===4) r.push([5,11,6,1,shirt]);                                                              // turtleneck collar covers the neck
  if(ts===6) r.push([5,11,2,1,'#f2efe6'],[9,11,2,1,'#f2efe6']);                                      // polo collar
  if(bun){ // bunny ears: drawn first so the head and hair cover their bases
    const EAR=[[-6,2,3],[-5,2,4],[-4,2,4],[-3,2,4],[-2,3,5],[-1,3,5],[0,3,6],[1,3,6],[2,4,6],[3,4,6],[4,4,6],[5,4,6]], [fc,ic,oc]=EARC[bun-3], ear=[];
    for(const mir of [0,1]) EAR.forEach(([y,a,b],i)=>{ const x1=mir?15-b:a, x2=mir?15-a:b, yy=y+dy;
      if(y<2) ear.push([x1-1,yy,1,1,oc],[x2+1,yy,1,1,oc]);

    r.splice(1,0,...ear); }
  r.push(...(HAIR_ART[l.hair]||HAIR_ART[0])(hc));
  if(bun) r.push([4,3+dy,8,1,EARC[bun-3][3]]);
  if(AS.has(1)) r.push([3,1,10,1,'#3a2f3a'],[2,2,1,4,'#3a2f3a'],[13,2,1,4,'#3a2f3a'],[1,6,2,4,'#d65a5a'],[13,6,2,4,'#d65a5a']);
  if(AS.has(2)) r.push([3,1,10,3,shirt],[2,3,12,2,shirt],[2,4,12,1,'rgba(0,0,0,.22)'],[7,0,2,1,'#f3e9d8']);
  const gold='#e8c14a';
  
    if(AS.has(6)) r.push([4,7,8,1,'#15131a'],[5,8,2,1,'#15131a'],[9,8,2,1,'#15131a'],[5,7,1,1,'#5a5a7a']);   // sunglasses
    if(AS.has(7)){ const c=dk(hc,.85), p='#f4a0b4'; r.push([4,0+dy,1,1,c],[4,1+dy,2,1,c],[4,2+dy,3,1,c],[5,1+dy,1,1,p],[5,2+dy,1,1,p],[11,0+dy,1,1,c],[10,1+dy,2,1,c],[9,2+dy,3,1,c],[10,1+dy,1,1,p],[10,2+dy,1,1,p]); }   // cat ears
  if(AS.has(8)) r.push([4,3+dy,8,1,gold],[4,2+dy,1,1,gold],[7,2+dy,2,1,gold],[11,2+dy,1,1,gold],[7,1+dy,2,1,gold],[5,3+dy,1,1,'#d65a5a'],[10,3+dy,1,1,'#4aa3df'],[7,3+dy,2,1,'#d65a5a']);   // crown
    if(AS.has(9)){ const v='#4f9a5a'; r.push([4,3+dy,8,1,v]); [[5,'#f4a0b4'],[8,'#ffffff'],[11,'#c9a0f0']].forEach(([x,c])=>r.push([x,2+dy,1,1,c],[x-1,3+dy,3,1,c],[x,4+dy,1,1,c],[x,3+dy,1,1,gold])); }   // flower crown
    if(AS.has(10)) r.push([10,1,1,3,'#d65a8a'],[11,2,1,1,'#d65a8a'],[12,2,1,1,'#a8305f'],[13,2,1,1,'#d65a8a'],[14,1,1,3,'#d65a8a'],[10,1,1,1,'#f08ab4'],[14,1,1,1,'#f08ab4']);   // bow: two little triangles and a knot
  if(AS.has(11)) r.push([4,2+dy,8,2,'#d65a5a'],[5,1+dy,6,1,'#d65a5a'],[3,4+dy,10,1,'#9d3a3a'],[7,1+dy,2,1,'#f2efe6']);   // cap with a brim
  if(AS.has(12)) r.push([4,11,8,1,'#d65a5a'],[4,12,8,1,'#f2efe6'],[4,13,8,1,'#d65a5a'],[10,14,2,3,'#d65a5a'],[10,15,2,1,'#f2efe6']);   // striped scarf
    if(AS.has(14)) r.push([5,0+dy,6,1,'#ffe680'],[4,1+dy,1,1,'#ffe680'],[11,1+dy,1,1,'#ffe680'],[5,1+dy,6,1,'rgba(255,230,128,.3)']);   // halo

}
const sprite=(l,w,h)=>`<svg viewBox="0 0 16 23" width="${w}" height="${h}" shape-rendering="crispEdges" overflow="visible">${R(spriteRects(l||DEFLOOK))}</svg>`;


const R=a=>a.map(r=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="${r[4]}"/>`).join('');

/* ---- themes + prompts ---- */
const THEMES=[
 {n:'Online',c:'#ff5fa2',p:['The most embarrassing thing you ever posted online','A time you got catfished or almost did','Your worst group chat moment','A stranger you ended up meeting from the internet']},
 {n:'Tech Fail',c:'#5fb3ff',p:['The time your phone or laptop died at the worst moment','You accidentally sent a message to the wrong person','The dumbest thing you did with a password','A time you got scammed or almost got scammed']},
 {n:'Viral',c:'#ffd24a',p:['The time you almost went viral','Your most-watched video or post ever','A meme you swear you invented','The weirdest thing you fell down an internet rabbit hole for']},
 {n:'Dating',c:'#5fd38a',p:['Your worst dating app date','The strangest DM you ever got','A time you got ghosted','Your most cringe thing you texted a crush']},
 {n:'Gaming',c:'#b48aff',p:['Your most unhinged moment in an online game','A username you regret','A time you rage quit','The most money you spent on something digital']},
 {n:'Late Night',c:'#ff9a56',p:['Something you bought online at 3am','The longest you ever stayed awake on your phone','A stalking-level deep dive you did on someone','An app you are secretly addicted to']}];
const SEG=360/THEMES.length;

/* ---- state ---- */
let S={}, people=[], animKey='';
const players=()=>people.filter(p=>!(p.isHost||String(p.id).startsWith('host_')));
const byId=id=>people.find(p=>p.id===id);
ref(`${E}/attendees`).on('value',sn=>{people=Object.values(sn.val()||{}).filter(p=>p&&p.id);render()});
ref(G).on('value',sn=>{S=sn.val()||{};render()});
const set=o=>ref(G).update(o);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const av=(p,w=32,h=46)=>sprite(p&&p.look,w,h);

/* ---- host actions ---- */
function spinWheel(){
  const i=Math.floor(Math.random()*THEMES.length), t=THEMES[i];
  const prompts={};players().forEach(p=>prompts[p.id]=pick(t.p));
  const rot=360*5+(360-(i*SEG+SEG/2))+(Math.random()-.5)*SEG*.6;
  set({phase:'wheel',themeIdx:i,rot,spinAt:Date.now(),prompts,choices:null,timerEnd:null,spoken:null,speaker:null,ring:null,votes:null,reveal:null});
}
function startTimer(){const s=+$('secs').value||60;set({phase:'think',timerEnd:Date.now()+s*1000})}
function pickSpeaker(){
  const spoken=S.spoken||{}, c=players().filter(p=>S.prompts&&S.prompts[p.id]&&!spoken[p.id]).map(p=>p.id);
  if(!c.length){set({phase:'board'});return}
  const idx=Math.floor(Math.random()*c.length);
  set({phase:'arrow',timerEnd:null,ring:c,speaker:c[idx],arrowAt:Date.now(),arrowRot:360*5+idx*(360/c.length),reveal:null});
}
async function reveal(){
  const sp=S.speaker; if(!sp)return;
  const truth=(S.choices||{})[sp]==='truth', v=(S.votes||{})[sp]||{}, sc={...(S.scores||{})};
  let fooled=0,right=0;
  Object.entries(v).forEach(([id,val])=>{ if((val==='truth')===truth){right++;sc[id]=(sc[id]||0)+1}else{fooled++;sc[sp]=(sc[sp]||0)+1} });
  set({phase:'reveal',scores:sc,reveal:{speaker:sp,truth,fooled,right},spoken:{...(S.spoken||{}),[sp]:true}});
}
const board=()=>set({phase:'board'});
function resetAll(){if(confirm('Reset the whole game and scores?'))ref(G).set(null)}

/* ---- guest actions ---- */
const choose=c=>ref(`${G}/choices/${me.id}`).set(c);
const vote=v=>ref(`${G}/votes/${S.speaker}/${me.id}`).set(v);

/* ---- rendering ---- */
var render=function(){
  const ph=S.phase||'lobby', pl=players();
  $('sub').innerHTML=me?`playing as <b>${esc(me.name)}</b> · ${pl.length} players`:'';
  renderAnim(ph); renderPanel(ph,pl); renderHost(ph);
};
const wheelSVG=()=>{
  let s='<svg id="wheel" viewBox="-100 -100 200 200">';
  THEMES.forEach((t,i)=>{const a0=(i*SEG-90)*Math.PI/180,a1=((i+1)*SEG-90)*Math.PI/180,m=(a0+a1)/2;
    s+=`<path d="M0 0L${(98*Math.cos(a0)).toFixed(1)} ${(98*Math.sin(a0)).toFixed(1)}A98 98 0 0 1 ${(98*Math.cos(a1)).toFixed(1)} ${(98*Math.sin(a1)).toFixed(1)}Z" fill="${t.c}" stroke="#14121c" stroke-width="2"/>`+
    `<text x="${(62*Math.cos(m)).toFixed(1)}" y="${(62*Math.sin(m)).toFixed(1)}" font-size="11" font-weight="700" fill="#111" text-anchor="middle" dominant-baseline="middle" transform="rotate(${(m*180/Math.PI+90).toFixed(1)} ${(62*Math.cos(m)).toFixed(1)} ${(62*Math.sin(m)).toFixed(1)})">${t.n}</text>`});
  return s+'<circle r="9" fill="#14121c"/></svg>';
};
function spin(el,rot,at,dur){
  const el0=Date.now()-at; el.style.transition='none';
  if(el0>=dur){el.style.transform=`rotate(${rot}deg)`;return}
  el.style.transform='rotate(0deg)'; el.getBoundingClientRect();
  el.style.transition=`transform ${dur-el0}ms cubic-bezier(.12,.6,.1,1)`; el.style.transform=`rotate(${rot}deg)`;
}
const WDUR=4500, ADUR=4500;
const wheelDone=()=>Date.now()-S.spinAt>=WDUR, arrowDone=()=>Date.now()-S.arrowAt>=ADUR;
function renderAnim(ph){
  const a=$('anim');
  let key='';
  if(ph==='wheel')key='w'+S.spinAt; else if(ph==='arrow')key='a'+S.arrowAt;
  if(key===animKey)return; animKey=key;
  if(!key){a.innerHTML='';return}
  if(ph==='wheel'){
    a.innerHTML=`<div class="stage"><div class="ptr">▼</div>${wheelSVG()}</div>`;
    spin($('wheel'),S.rot,S.spinAt,WDUR); setTimeout(render,WDUR+100);
  }else{
    const ring=S.ring||[],n=ring.length;
    let h='<div class="stage"><div class="ring">';
    ring.forEach((id,i)=>{const ang=i*360/n*Math.PI/180,r=min(120);
      h+=`<div class="p" style="left:${(r*Math.sin(ang)).toFixed(0)}px;top:${(-r*Math.cos(ang)).toFixed(0)}px">${av(byId(id),28,40)}<b>${esc((byId(id)||{}).name)}</b></div>`});
    a.innerHTML=h+'</div><div id="arrow"></div></div>';
    spin($('arrow'),S.arrowRot,S.arrowAt,ADUR); setTimeout(render,ADUR+100);
  }
}
const min=r=>Math.min(r,window.innerWidth*0.3);
function ppl(list,mark){return `<div class="ppl">`+list.map(p=>`<div class="p ${mark&&mark(p)?'on':''}">${av(p)}<b>${esc(p.name)}</b></div>`).join('')+`</div>`}
function renderPanel(ph,pl){
  const P=$('panel'); let h='';
  if(!me&&!isHost){P.innerHTML=`<div class="card"><div class="big">Make your character first</div><p class="dim">You need to join the party before you can play.</p><a href="${HOME}">Go to the party →</a></div>`;return}
  const mine=me&&(S.prompts||{})[me.id], myc=me&&(S.choices||{})[me.id], sp=S.speaker, spP=byId(sp);
  if(ph==='lobby'){
    h=`<div class="card"><div class="big">Waiting for the host…</div><p class="dim">Here's who's in:</p>${ppl(pl)}</div>`;
  }else if(ph==='wheel'){
    if(!wheelDone())h=`<div class="big">Spinning…</div>`;
    else h=choiceCard(mine,myc,`Topic: ${THEMES[S.themeIdx].n}`);
  }else if(ph==='think'){
    h=`<div class="card"><div class="dim">Time to think…</div><div class="timer" id="tm">--</div></div>`+choiceCard(mine,myc,`Topic: ${THEMES[S.themeIdx].n}`);
  }else if(ph==='arrow'||ph==='story'||ph==='reveal'){
    const ready=ph!=='arrow'||arrowDone();
    if(!ready)h=`<div class="big">Who's it gonna be…</div>`;
    else{
      const isMe=me&&sp===me.id;
      h=`<div class="card"><div class="lower">${ph==='reveal'?'THE VERDICT':'ON STAGE NOW'}</div>${spP?av(spP,48,69):''}<div class="big">${esc(spP&&spP.name)}${isMe?' (you!)':''}</div>`;
      if(S.prompts&&S.prompts[sp])h+=`<div class="prompt">${esc(S.prompts[sp])}</div>`;
      if(isHost&&ph!=='reveal')h+=`<div class="dim">They chose: <b>${(S.choices||{})[sp]==='truth'?'TRUTH':(S.choices||{})[sp]==='lie'?'LIE':'(nothing)'}</b></div>`;
      if(ph==='reveal'){const r=S.reveal||{};h+=`<div class="big" style="color:${r.truth?'var(--green)':'var(--red)'}">${r.truth?'✅ TRUTH TELLER':'🤥 LIAR'}</div><div class="dim">${r.fooled||0} fooled · ${r.right||0} guessed right</div>`}
      h+='</div>';
      if(ph!=='reveal'&&me&&!isMe){
        const my=((S.votes||{})[sp]||{})[me.id];
        h+=`<div class="dim">Is ${esc(spP&&spP.name)} lying?</div><div class="row" style="margin-top:8px"><button class="lie ${my==='liar'?'':'alt'}" onclick="vote('liar')">🤥 LIAR</button><button class="truth ${my==='truth'?'':'alt'}" onclick="vote('truth')">😇 TRUTH</button></div>${my?'<div class="dim" style="margin-top:6px">Vote locked in — tap again to change</div>':''}`;
      }else if(ph!=='reveal'&&isMe)h+=`<div class="dim">Tell your story! You chose to <b>${myc==='truth'?'tell the truth':'lie'}</b>. Don't give it away 😏</div>`;
      const vs=(S.votes||{})[sp]||{};
      h+=`<div class="dim" style="margin:12px 0 6px">${Object.keys(vs).length} voted</div>`+ppl(pl,p=>p.id===sp);
    }
  }else if(ph==='board'){
    const sc=S.scores||{}, rank=[...pl].sort((a,b)=>(sc[b.id]||0)-(sc[a.id]||0));
    h=`<div class="big">🏆 LEADERBOARD</div>`+rank.map((p,i)=>`<div class="lb ${i===0?'first':''}"><span class="n">${i===0?'👑':i+1}</span>${av(p,24,34)}<b>${esc(p.name)}</b><span class="s">${sc[p.id]||0}</span></div>`).join('')+
      (rank[0]?`<div class="big" style="color:var(--gold);margin-top:14px">Best Liar in Town: ${esc(rank[0].name)}</div>`:'');
  }
  P.innerHTML=h; tick();
}
function choiceCard(mine,myc,topic){
  if(isHost)return `<div class="card"><div class="dim">${topic}</div><div class="dim" style="margin-top:6px">Chosen so far: ${Object.keys(S.choices||{}).length} / ${players().length}</div></div>`;
  if(!mine)return `<div class="card dim">You joined after the wheel spun — watch this round!</div>`;
  return `<div class="card"><div class="dim">${topic}</div><div class="prompt">${esc(mine)}</div><div class="dim" style="margin-bottom:8px">Pick your plan (nobody sees this):</div>
  <div class="row"><button class="lie ${myc==='lie'?'':'alt'}" onclick="choose('lie')">🤥 I'm going to LIE</button><button class="truth ${myc==='truth'?'':'alt'}" onclick="choose('truth')">😇 I'll tell the TRUTH</button></div>
  ${myc?`<div class="dim" style="margin-top:8px">Locked in: <b>${myc==='lie'?'LIE':'TRUTH'}</b></div>`:''}</div>`;
}
function renderHost(ph){
  if(!isHost)return; $('host').style.display='block';
  const b=(t,f,c='')=>`<button class="${c}" onclick="${f}()">${t}</button>`;
  let h='';
  if(ph==='lobby'||ph==='board')h=b('🎡 Spin the wheel','spinWheel');
  else if(ph==='wheel')h=b('⏱ Start thinking timer','startTimer')+`<div style="margin-top:8px" class="dim">seconds: <input id="secs" type="number" value="60"></div>`;
  else if(ph==='think')h=b("⏰ Time's up — spin the arrow",'pickSpeaker');
  else if(ph==='arrow'||ph==='story')h=b('✅ Reveal answer','reveal');
  else if(ph==='reveal')h=b('➡️ Next speaker','pickSpeaker');
  h+=`<div class="row" style="margin-top:8px">${b('🏆 Leaderboard','board','alt')}${b('Reset','resetAll','alt')}</div>`;
  const old=$('secs')&&$('secs').value;
  $('hostbtns').innerHTML=h; if(old&&$('secs'))$('secs').value=old;
  $('hostinfo').textContent='HOST CONTROLS · phase: '+ph;
}
function tick(){
  const t=$('tm'); if(!t||!S.timerEnd)return;
  const left=Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)); t.textContent=left>0?left+'s':"Time's up!";
}
setInterval(tick,250);
/* ---- TV extras ---- */
if(isHost)document.body.classList.add('hosting');
const clk=()=>{$('clk').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};clk();setInterval(clk,15000);
const NEWS=['🎙 LIVE from the party: the search for the BEST LIAR IN TOWN','Breaking: someone in this room is lying right now','Stay tuned — the wheel decides your fate','Experts say 100% of guests have lied at least once tonight','Do NOT trust the person next to you','Audience at home: please vote responsibly'];
const SAY={lobby:'Waiting for tonight’s guests to take their seats',wheel:'The wheel of topics is spinning!',think:'Guests are making up their stories… time is ticking',arrow:'The arrow is choosing a guest!',story:'A guest is on stage — LIAR or TRUTH?',reveal:'The truth is revealed!',board:'And your BEST LIAR IN TOWN is…'};
let lastTk='';function setTicker(ph){const m='★ '+(SAY[ph]||'')+'   ●   '+NEWS.join('   ●   ');if(m!==lastTk){lastTk=m;$('tk').textContent=m}}
const _render=render;render=function(){_render();setTicker(S.phase||'lobby')};


</script></body></html>
